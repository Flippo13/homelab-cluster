apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - name: kavita
          image: ghcr.io/kareadita/kavita:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Brussels"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          volumeMounts:
            - mountPath: /kavita/config
              name: kavita-config
            - mountPath: /books
              name: kavita-books
      volumes:
        - name: kavita-config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: kavita-books
          persistentVolumeClaim:
            claimName: kavita-books
